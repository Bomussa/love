<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/medical_logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- Performance optimizations -->
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="نظام إدارة الطوابير للمركز الطبي العسكري - Military Medical Committee Queue Management System" />
    
    <!-- Preconnect to external domains -->
    <link rel="preconnect" href="https://rujwuruuosffcxazymit.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://rujwuruuosffcxazymit.supabase.co" />
    
    <!-- Google Fonts - Cairo (Arabic Professional Font) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Preload critical resources -->
    <link rel="modulepreload" href="/src/main.jsx" />
    
    <title>اللجنة الطبية العسكرية - Military Medical Committee</title>
    <!-- Build Version: 2026-01-08-v2 -->
    
    <!-- Inline critical CSS for faster first paint -->
    <style>
      /* Critical CSS - Loading state */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      #root {
        width: 100%;
        min-height: 100vh;
        min-height: -webkit-fill-available;
        min-height: 100dvh;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #8A1538 0%, #6B0F2A 50%, #C9A54C 100%);
      }
      
      /* Prevent FOUC */
      html {
        height: 100%;
        height: -webkit-fill-available;
      }
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        min-height: -webkit-fill-available;
        overflow-x: hidden;
        font-family: 'Cairo', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      /* Loading spinner */
      .loading {
        width: 50px;
        height: 50px;
        border: 4px solid #f3f3f3;
        border-top: 4px solid #3498db;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Loading indicator -->
      <div class="loading"></div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
