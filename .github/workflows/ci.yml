name: Frontend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, certification-hardening-20260726]

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Check duplicate active components
        run: npm run check:duplicate-components

      - name: Check forbidden conflict files
        run: npm run check:no-conflict-files --prefix frontend

      - name: Typecheck
        run: npm run typecheck --prefix frontend

      - name: Build production bundle
        run: npm run build
