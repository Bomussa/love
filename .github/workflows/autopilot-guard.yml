name: Autopilot Guard

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate-autopilot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Validate Autopilot Configuration
        run: node scripts/validate-autopilot.js

  autopilot-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Run Autopilot Router Smoke Test
        run: node scripts/autopilot-router.js "queue endpoint gives duplicate numbers" --md
