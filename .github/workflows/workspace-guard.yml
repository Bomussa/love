name: Workspace Guard

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-workspaces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate declared workspaces exist
        run: node scripts/ci/validate-workspaces.mjs
